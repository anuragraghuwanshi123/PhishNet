
services:
  api:
    build: .
    container_name: phishnet-api
    ports:
      - "8002:8000"
    environment:
      - API_KEY=demo-key
      - JWT_SECRET_KEY=secret
      
    depends_on:
      
      - prometheus
    networks:
      - backend

  #redis:
   # container_name: phishnet-redis
   # ports:
   #   - "6379:6379"
    #networks:
    #  - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: phishnet-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: phishnet-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - backend

networks:
  backend:
    driver: bridge